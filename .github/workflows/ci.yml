name: CI

on:
  push:
    branches: [main, 'claude/release-*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Validate & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run check:contrast
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Chromium)
    # Playwright 1.56.1 cannot install Chromium on Ubuntu 26.04 (ubuntu-latest in Nov 2026).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
