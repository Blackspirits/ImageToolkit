<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="customResizeTitle">Adjust Image</title>
  <link rel="stylesheet" href="lib/cropper.min.css">
  <link rel="stylesheet" href="lib/ui.css">
  <link rel="stylesheet" href="resize.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-flip-h" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7 3 12l5 5V7Z"/><path d="M16 7l5 5-5 5V7Z" stroke-dasharray="2 2.2"/></symbol>
    <symbol id="i-flip-v" viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M7 8l5-5 5 5H7Z"/><path d="M7 16l5 5 5-5H7Z" stroke-dasharray="2 2.2"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 7.8-1.2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3 13.9 8.1 19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-ratio-free" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" stroke-dasharray="3 2.2"/></symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></symbol>
    <symbol id="i-facebook" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3Z"/></symbol>
    <symbol id="i-youtube" viewBox="0 0 24 24"><path d="M2.5 17a24 24 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.6 49.6 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24 24 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.6 49.6 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></symbol>
    <symbol id="i-x-social" viewBox="0 0 24 24"><path d="M4 4l16 16M20 4 4 20"/></symbol>
    <symbol id="i-linkedin" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.8V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4.8a2 2 0 0 0 1.1 1.8l1.8.9A2 2 0 0 1 19 15.2V16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-.8a2 2 0 0 1 1.1-1.8l1.8-.9A2 2 0 0 0 9 10.8Z"/></symbol>
  </svg>

  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-brand">
        <img src="icons/icon48.png" alt="" class="topbar-logo" width="28" height="28">
        <h1 data-i18n="customResizeTitle">Adjust Image</h1>
      </div>
      <div class="topbar-info">
        <span id="info-text" class="pill"></span>
        <span id="crop-info" class="pill pill-accent" hidden></span>
      </div>
    </header>

    <div class="main">
      <section class="stage">
        <div class="crop-area" id="crop-area">
          <div class="crop-inner"><img id="cropper-img" src="" alt=""></div>
          <div id="stage-status" class="stage-status"><div class="spinner"></div><span data-i18n="loadingImageInfo">Loading image info...</span></div>
        </div>
        <div class="floating-tools" role="toolbar">
          <button class="icon-btn" id="btn-rotate-left" data-i18n-title="pRotateLeft" title="Rotate left"><svg class="i"><use href="#i-rotate"/></svg></button>
          <button class="icon-btn" id="btn-flip-h" data-i18n-title="pFlipH" title="Flip horizontal"><svg class="i"><use href="#i-flip-h"/></svg></button>
          <button class="icon-btn" id="btn-flip-v" data-i18n-title="pFlipV" title="Flip vertical"><svg class="i"><use href="#i-flip-v"/></svg></button>
          <span class="tool-sep"></span>
          <button class="icon-btn" id="btn-reset" data-i18n-title="resetCrop" title="Reset"><svg class="i"><use href="#i-reset"/></svg></button>
          <div class="bg-group" id="bg-group" role="group" data-i18n-aria="bgPreview" aria-label="Background Preview" hidden>
            <span class="tool-sep"></span>
            <button class="bg-btn bg-checker active" data-bg="checker" data-i18n-title="bgTransparent" title="Transparent"></button>
            <button class="bg-btn bg-white" data-bg="#ffffff" data-i18n-title="bgWhite" title="White"></button>
            <button class="bg-btn bg-gray" data-bg="#808080" data-i18n-title="bgGray" title="Gray"></button>
            <button class="bg-btn bg-black" data-bg="#000000" data-i18n-title="bgBlack" title="Black"></button>
          </div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-scroll">
          <section class="panel">
            <h2 class="panel-title" data-i18n="cropArea">Crop Area</h2>
            <div class="dims">
              <label class="dim"><span data-i18n="placeholderWidth">W</span><input type="number" id="crop-w" class="input input-num" min="1" max="16384" inputmode="numeric"></label>
              <button id="btn-lock" class="icon-btn lock active" aria-pressed="true" data-i18n-title="titleLockRatio" title="Lock ratio"><svg class="i i-sm"><use href="#i-lock"/></svg></button>
              <label class="dim"><span data-i18n="placeholderHeight">H</span><input type="number" id="crop-h" class="input input-num" min="1" max="16384" inputmode="numeric"></label>
              <button id="btn-apply-dims" class="btn btn-ghost btn-sm" data-i18n="applyDimensions">Apply</button>
            </div>
          </section>

          <section class="panel">
            <h2 class="panel-title" data-i18n="outputSize">Output Size</h2>
            <div class="dims">
              <label class="dim"><span data-i18n="placeholderWidth">W</span><input type="number" id="out-w" class="input input-num" min="1" max="16384" inputmode="numeric"></label>
              <span class="dims-x">×</span>
              <label class="dim"><span data-i18n="placeholderHeight">H</span><input type="number" id="out-h" class="input input-num" min="1" max="16384" inputmode="numeric"></label>
            </div>
          </section>

          <details class="panel" open>
            <summary class="panel-title"><span data-i18n="presetAspectRatio">Aspect Ratio</span><svg class="i i-sm chev"><use href="#i-chevron-down"/></svg></summary>
            <div class="chips ratio-grid">
              <button class="ratio ratio-wide" data-preset="free"><svg class="i"><use href="#i-image"/></svg><span data-i18n="pOriginal">Original</span></button>
              <button class="ratio ratio-wide" data-preset="custom"><svg class="i"><use href="#i-ratio-free"/></svg><span data-i18n="pCustom">Custom</span></button>
              <button class="ratio" data-preset-ratio="1x1"><i style="--w:16;--h:16"></i><span>1:1</span></button>
              <button class="ratio" data-preset-ratio="4x5"><i style="--w:13;--h:16"></i><span>4:5</span></button>
              <button class="ratio" data-preset-ratio="3x2"><i style="--w:18;--h:12"></i><span>3:2</span></button>
              <button class="ratio" data-preset-ratio="2x3"><i style="--w:12;--h:18"></i><span>2:3</span></button>
              <button class="ratio" data-preset-ratio="16x9"><i style="--w:20;--h:11.25"></i><span>16:9</span></button>
              <button class="ratio" data-preset-ratio="9x16"><i style="--w:10;--h:17.8"></i><span>9:16</span></button>
              <button class="ratio" data-preset-ratio="5x4"><i style="--w:17;--h:13.6"></i><span>5:4</span></button>
              <button class="ratio" data-preset-ratio="21x9"><i style="--w:21;--h:9"></i><span>21:9</span></button>
            </div>
          </details>

          <details class="panel" open>
            <summary class="panel-title"><span data-i18n="presetSocial">Social Media</span><svg class="i i-sm chev"><use href="#i-chevron-down"/></svg></summary>
            <div class="chips">
              <button class="chip-btn" data-preset="1080x1080" title="Instagram · 1080×1080"><svg class="i i-sm"><use href="#i-instagram"/></svg><span data-i18n="pPost">Post</span></button>
              <button class="chip-btn" data-preset="1080x1350" title="Instagram · 1080×1350"><svg class="i i-sm"><use href="#i-instagram"/></svg>4:5</button>
              <button class="chip-btn" data-preset="1080x1920" title="Instagram / TikTok · 1080×1920"><svg class="i i-sm"><use href="#i-instagram"/></svg><span data-i18n="pStory">Story</span></button>
              <button class="chip-btn" data-preset="820x312" title="Facebook · 820×312"><svg class="i i-sm"><use href="#i-facebook"/></svg><span data-i18n="pCover">Cover</span></button>
              <button class="chip-btn" data-preset="1280x720" title="YouTube · 1280×720"><svg class="i i-sm"><use href="#i-youtube"/></svg><span data-i18n="pThumb">Thumb</span></button>
              <button class="chip-btn" data-preset="1500x500" title="X · 1500×500"><svg class="i i-sm"><use href="#i-x-social"/></svg><span data-i18n="pHeader">Header</span></button>
              <button class="chip-btn" data-preset="1584x396" title="LinkedIn · 1584×396"><svg class="i i-sm"><use href="#i-linkedin"/></svg><span data-i18n="pBanner">Banner</span></button>
              <button class="chip-btn" data-preset="1000x1500" title="Pinterest · 1000×1500"><svg class="i i-sm"><use href="#i-pin"/></svg><span data-i18n="pPin">Pin</span></button>
            </div>
          </details>

          <details class="panel" open>
            <summary class="panel-title"><span data-i18n="presetCommon">Common Sizes</span><svg class="i i-sm chev"><use href="#i-chevron-down"/></svg></summary>
            <div class="chips">
              <button class="chip-btn" data-preset="3840x2160" title="3840×2160">4K</button>
              <button class="chip-btn" data-preset="2560x1440" title="2560×1440">2K</button>
              <button class="chip-btn" data-preset="1920x1080" title="1920×1080">FHD</button>
              <button class="chip-btn" data-preset="1280x720" title="1280×720">HD</button>
              <button class="chip-btn" data-preset="800x600">800×600</button>
              <button class="chip-btn" data-preset="512x512">512²</button>
            </div>
          </details>

          <details class="panel">
            <summary class="panel-title"><span>TMDB</span><svg class="i i-sm chev"><use href="#i-chevron-down"/></svg></summary>
            <div class="chips">
              <button class="chip-btn" data-preset="2000x3000" data-i18n="pPoster" title="2000×3000">Poster</button>
              <button class="chip-btn" data-preset="3840x2160" data-i18n="pBackdrop" title="3840×2160">Backdrop</button>
              <button class="chip-btn" data-preset="1280x720" data-i18n="pStill" title="1280×720">Still</button>
              <button class="chip-btn" data-preset="300x450" data-i18n="pProfile" title="300×450">Profile</button>
            </div>
          </details>

          <details class="panel">
            <summary class="panel-title"><span>TheTVDB</span><svg class="i i-sm chev"><use href="#i-chevron-down"/></svg></summary>
            <div class="chips">
              <button class="chip-btn" data-preset="680x1000" data-i18n="pPoster" title="680×1000">Poster</button>
              <button class="chip-btn" data-preset="1920x1080" data-i18n="pBg" title="1920×1080">BG</button>
              <button class="chip-btn" data-preset="758x140" data-i18n="pBanner" title="758×140">Banner</button>
              <button class="chip-btn" data-preset="640x360" data-i18n="pEpHd" title="640×360">Ep HD</button>
              <button class="chip-btn" data-preset="640x480" data-i18n="pEpSd" title="640×480">Ep SD</button>
              <button class="chip-btn" data-preset="300x450" data-i18n="pActor" title="300×450">Actor</button>
              <button class="chip-btn" data-preset="1000x562" title="1000×562">ClearArt</button>
              <button class="chip-btn" data-preset="800x310" title="800×310">ClearLogo</button>
              <button class="chip-btn" data-preset="1024x1024" data-i18n="pIcon" title="1024×1024">Icon</button>
              <button class="chip-btn" data-preset="1280x720" data-i18n="pCinema" title="1280×720">Cinemagraph</button>
            </div>
          </details>
        </div>

        <footer class="sidebar-foot">
          <div class="foot-row">
            <span class="foot-label" id="format-label" data-i18n="formatLabel">Format</span>
            <div class="segmented segmented-block" id="resize-format" role="radiogroup" aria-labelledby="format-label">
              <button class="seg" data-value="png" role="radio">PNG</button><button class="seg" data-value="jpeg" role="radio">JPG</button><button class="seg active" data-value="webp" role="radio">WebP</button><button class="seg" data-value="avif" role="radio">AVIF</button>
            </div>
          </div>
          <div class="foot-row" id="quality-row">
            <label class="foot-label" for="resize-quality" data-i18n="qualityLabel">Quality</label>
            <div class="quality"><input type="range" id="resize-quality" class="range" min="10" max="100" value="85"><output id="resize-quality-value" class="value">85%</output></div>
          </div>
          <div class="foot-actions">
            <button id="btn-copy" class="btn btn-ghost" data-i18n-title="copyImage" title="Copy image"><svg class="i i-sm"><use href="#i-copy"/></svg><span data-i18n="copyClipboard">Copy</span></button>
            <button id="btn-save" class="btn btn-primary"><svg class="i i-sm"><use href="#i-download"/></svg><span data-i18n="saveImage">Save Image</span></button>
          </div>
        </footer>
      </aside>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  </div>
  <script src="lib/core.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="lib/ui.js"></script>
  <script src="lib/handoff.js"></script>
  <script src="lib/cropper.min.js"></script>
  <script src="resize.js"></script>
</body>
</html>
