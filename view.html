<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="viewerTitle">Screenshot</title>
  <link rel="stylesheet" href="lib/ui.css">
  <link rel="stylesheet" href="view.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-crop" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></symbol>
    <symbol id="i-annotate" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-actual" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M8 9h1v6M15 9h1v6M12 10.5v.01M12 14v.01"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></symbol>
  </svg>

  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-brand">
        <img src="icons/icon48.png" alt="" class="topbar-logo" width="28" height="28">
        <h1 data-i18n="viewerTitle">Screenshot</h1>
        <span id="info-text" class="pill"></span>
      </div>
      <div class="topbar-actions" role="toolbar" data-i18n-aria="viewerTitle" aria-label="Screenshot">
        <button id="btn-zoom" class="btn btn-ghost" aria-pressed="false"><svg class="i i-sm"><use href="#i-fit"/></svg><span data-i18n="zoomFit">Fit to window</span></button>
        <span class="tool-sep"></span>
        <button id="btn-crop" class="btn btn-ghost" data-i18n-title="customResizeTitle" title="Crop &amp; resize"><svg class="i i-sm"><use href="#i-crop"/></svg><span data-i18n="cropAction">Crop</span></button>
        <button id="btn-annotate" class="btn btn-ghost" data-i18n-title="annotateHint" title="Annotate"><svg class="i i-sm"><use href="#i-annotate"/></svg><span data-i18n="annotate">Annotate</span></button>
        <span class="tool-sep"></span>
        <div class="segmented" id="view-format" role="radiogroup" data-i18n-aria="formatLabel" aria-label="Format">
          <button class="seg" data-value="png" role="radio">PNG</button><button class="seg" data-value="jpeg" role="radio">JPG</button><button class="seg" data-value="webp" role="radio">WebP</button>
        </div>
        <button id="btn-copy" class="btn btn-ghost" data-i18n-title="copyImage" title="Copy image"><svg class="i i-sm"><use href="#i-copy"/></svg><span data-i18n="copyClipboard">Copy</span></button>
        <button id="btn-save" class="btn btn-primary"><svg class="i i-sm"><use href="#i-download"/></svg><span data-i18n="saveImage">Save image</span></button>
      </div>
    </header>

    <main class="stage" id="stage" tabindex="-1">
      <div id="stage-status" class="stage-status"><div class="spinner"></div><span data-i18n="loadingImageInfo">Loading image info...</span></div>
      <img id="shot" class="shot" alt="" hidden>
    </main>
  </div>

  <script src="lib/core.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="lib/ui.js"></script>
  <script src="lib/handoff.js"></script>
  <script src="view.js"></script>
</body>
</html>
